<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title id="titleWeb">To My Love</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/spinload.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Pacifico">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
</head>

<body onload="loadSound()">
  <div class="wrapper">
    <!-- Preloader -->
    <div id="preloader">
      <div class="spinner">
        <div class="rect1"></div>
        <div class="rect2"></div>
        <div class="rect3"></div>
        <div class="rect4"></div>
        <div class="rect5"></div>
      </div>
    </div>

    <div id="bg"></div>
    <div class="content">
      <header>
        <h2 id="title">To the Love of My Life 💘</h2>
        <h4 id="desc">Every moment with you feels like a dream ✨</h4>
      </header>
      <button id="yes" class="btn btn-danger btn-lg">Yes 💖</button>
      <button id="no" class="btn btn-info btn-lg">No 🙈</button>
    </div>
  </div>

  <!-- JS -->
  <script src="https://code.jquery.com/jquery-3.4.1.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@9"></script>
  <script src="./config.js"></script>
  <script src="./js/main.js"></script>
  <script>
    function loadSound() {
      var audio = new Audio('sound/sound.mp3');
      audio.play();
    }
  </script>
</body>
</html>
